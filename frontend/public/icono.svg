  <rect width="64" height="64" rx="14" fill="#2f5d50"/>
  <path d="M14 44 L26 32 L36 38 L50 20"
        fill="none" stroke="#fbfaf8" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="50" cy="20" r="4" fill="#fbfaf8"/>
</svg>
