<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/icono.svg" />
    <link rel="apple-touch-icon" href="/icono.svg" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfaf8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171613" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mi inversión" />
    <title>Mi herramienta de inversión</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Va aquí, en línea y antes de la aplicación, a propósito: si el tema se
      aplicara desde React, al abrir en oscuro habría un destello blanco a
      pantalla completa mientras carga el JavaScript. Duplicar estas cuatro
      líneas en el HTML es preferible a ese fogonazo cada mañana.
    -->
    <script>
      (function () {
        var guardado = null
        try { guardado = localStorage.getItem('tema') } catch (e) { guardado = null }
        var oscuro =
          guardado === 'oscuro' ||
          ((!guardado || guardado === 'auto') &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = oscuro ? 'dark' : 'light'
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
